name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Lấy source code từ repository
      - name: Checkout
        uses: actions/checkout@v4

      # Cài .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore dependencies
      - name: Restore
        run: dotnet restore

      # Build project
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Chạy test
      - name: Test
        run: dotnet test --no-build --configuration Release

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Chỉ deploy khi push vào nhánh main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./test-deploy
          file: ./test-deploy/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/test-deploy:latest,${{ secrets.DOCKER_USERNAME }}/test-deploy:1.0

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # THAY ĐỔI ĐƯỜNG DẪN DƯỚI ĐÂY CHO PHÙ HỢP VỚI THƯ MỤC CHỨA docker-compose.yml TRÊN SERVER CỦA BẠN
            cd /app/test-deploy
            
            # Kéo image mới nhất về
            docker pull ${{ secrets.DOCKER_USERNAME }}/test-deploy:latest
            
            # Khởi động lại các container
            docker-compose up -d
